<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notiziario Audio</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #000000;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    main {
      max-width: 520px;
      width: 100%;
    }
    audio {
      width: 100%;
      margin-bottom: 32px;
    }
    a {
      color: #90caf9;
      text-decoration: underline;
      font-size: 1.35rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <audio id="lettore" controls autoplay preload="auto" aria-label="Lettore notiziario audio">
      Il tuo browser non supporta il lettore audio.
    </audio>
    <p><a href="javascript:history.back()">Torna al sito</a></p>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    const titolo = params.get('titolo');
    const lettore = document.getElementById('lettore');

    if (titolo) {
      document.title = titolo;
      lettore.setAttribute('aria-label', titolo);
    }

    if (file && /^[a-zA-Z0-9._-]+\.mp3$/i.test(file)) {
      lettore.src = file;
      lettore.play().catch(() => {
      });
    } else {
      document.querySelector('main').innerHTML = '<p>File audio non trovato.</p><p><a href="javascript:history.back()">Torna al sito</a></p>';
    }
  </script>
</body>
</html>
